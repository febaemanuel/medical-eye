<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f4f6" />
    <meta name="description" content="Ficha de avaliação de feridas para profissionais, internos e estudantes de saúde." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Medical Eye</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/assets/4/styles.css" />
    <script type="module" src="/assets/4/app/main.mjs"></script>
